# Services the NUCLEO composition leaves out, built only so the static analyzer
# sees their code with the board's compiler. The result is not linked.
CONFIG_KFSW_FBO=y
CONFIG_KFSW_JOURNAL=y
CONFIG_KFSW_HK_STORE=y
CONFIG_KFSW_RESMON=y
CONFIG_KFSW_COMMAND_RETRY=y
CONFIG_KFSW_FWU=y
CONFIG_KFSW_FWU_MCUBOOT=n
CONFIG_MCUBOOT_BOOTUTIL_LIB=y
