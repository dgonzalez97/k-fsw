CONFIG_KFSW_CSP_ADDRESS=2
CONFIG_KFSW_CSP_HOSTNAME="kfsw-can-2"
CONFIG_SHELL_PROMPT_UART="kfsw-can-2# "

# This node reaches the other one over CAN alone, so the KISS link is out.
CONFIG_KFSW_CSP_KISS_UART=n
CONFIG_KFSW_CSP_ROUTE_TABLE="0/0 CAN"

CONFIG_CAN=y
CONFIG_KFSW_CSP_CAN=y
CONFIG_KFSW_CSP_CAN_INTERFACE_NAME="CAN"
CONFIG_KFSW_CSP_CAN_BITRATE=500000
CONFIG_KFSW_CSP_CAN_PREFIX_LENGTH=0

# SocketCAN polls transmit completion after a 1 ms sleep.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
