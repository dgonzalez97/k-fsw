CONFIG_WATCHDOG=y
CONFIG_COUNTER=y
CONFIG_KFSW_WATCHDOG=y
CONFIG_KFSW_WATCHDOG_TIMEOUT_MS=4000
CONFIG_KFSW_HEALTH=y
CONFIG_KFSW_HEALTH_INTERVAL_MS=100
CONFIG_KFSW_CSP_LIVENESS=y
CONFIG_KFSW_CSP_LIVENESS_PERIOD_MS=200
CONFIG_KFSW_CSP_LIVENESS_TIMEOUT_MS=50
CONFIG_KFSW_CSP_LIVENESS_DEADLINE_MS=2000
CONFIG_KERNEL_SHELL=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
# Suspend and resume commands are selected by KERNEL_SHELL and THREAD_MONITOR.
# Keep this test independent of optional UART codecs and crypto.
CONFIG_KFSW_CSP_UART_CODEC=n
