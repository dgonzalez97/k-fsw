CONFIG_ZTEST=y

CONFIG_KFSW_GNDWDT=y
CONFIG_KFSW_GNDWDT_TIMEOUT_S=86400
CONFIG_KFSW_GNDWDT_TIMEOUT_MIN_S=7200
CONFIG_KFSW_GNDWDT_TIMEOUT_MAX_S=432000
# Long, so the service's own worker cannot consume an expiry before a test
# looks at it. Most tests call kfsw_gndwdt_evaluate() directly; the reset test
# sleeps past this on purpose to let the worker run.
CONFIG_KFSW_GNDWDT_CHECK_MS=60000
CONFIG_KFSW_GNDWDT_RESET_DELAY_MS=100

# The service requires REBOOT. sys_reboot is wrapped, so the reset path runs
# without stopping the test process.
CONFIG_REBOOT=y
