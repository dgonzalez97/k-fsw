CONFIG_ZTEST=y

CONFIG_KFSW_GNDWDT=y
CONFIG_KFSW_GNDWDT_TIMEOUT_S=1
CONFIG_KFSW_GNDWDT_TIMEOUT_MIN_S=1
CONFIG_KFSW_GNDWDT_TIMEOUT_MAX_S=60
# Longer than the whole suite, so the service's own worker cannot consume an
# expiry before a test looks at it. The tests call kfsw_gndwdt_evaluate().
CONFIG_KFSW_GNDWDT_CHECK_MS=60000
CONFIG_KFSW_GNDWDT_RESET_DELAY_MS=100

# REBOOT stays off: the work handler would otherwise stop the test process
# when the countdown runs out.
CONFIG_REBOOT=n
