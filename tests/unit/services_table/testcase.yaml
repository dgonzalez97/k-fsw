tests:
  kfsw.services.table:
    tags:
      - unit
      - services
      - param
      - table
    platform_allow:
      - native_sim/native
      - native_sim/native/64
    integration_platforms:
      - native_sim/native
      - native_sim/native/64
  kfsw.services.table.text_persistence:
    tags: [unit, services, param, storage]
    platform_allow: [native_sim/native, native_sim/native/64]
    integration_platforms: [native_sim/native, native_sim/native/64]
    extra_configs:
      - CONFIG_KFSW_PARAM_PERSISTENCE=y
    extra_args: EXTRA_CFLAGS=-DKFSW_TEST_TEXT_PERSIST=1
