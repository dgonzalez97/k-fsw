CONFIG_ZTEST=y
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_KFSW_CSP=y
CONFIG_KFSW_CSP_ADDRESS=7
CONFIG_KFSW_CSP_HOSTNAME="kfsw-test"
CONFIG_KFSW_CSP_KISS_UART=n

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n

CONFIG_KFSW_REMEXEC=y
# Small, so the over-long allowlist this suite tries stays small too.
CONFIG_KFSW_REMEXEC_MAX_ENTRIES=4
