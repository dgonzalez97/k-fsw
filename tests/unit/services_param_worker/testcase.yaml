tests:
  kfsw.services.param_worker:
    tags: [unit, services, param, csp]
    platform_allow: [native_sim/native/64]
    integration_platforms: [native_sim/native/64]
  kfsw.services.param_worker.local_only:
    tags: [unit, services, param, csp]
    platform_allow: [native_sim/native/64]
    integration_platforms: [native_sim/native/64]
    extra_args: EXTRA_CFLAGS=-DKFSW_TEST_LOCAL_ONLY=1
  kfsw.services.param_worker.led:
    tags: [unit, services, param, csp, gpio]
    platform_allow: [native_sim/native/64]
    integration_platforms: [native_sim/native/64]
    extra_configs:
      - CONFIG_GPIO=y
      - CONFIG_GPIO_EMUL=y
      - CONFIG_KFSW_BOTON_TEST=y
      - CONFIG_KFSW_BOTON_TEST_LED_GPIO=y
      - CONFIG_KFSW_BOTON_TEST_SHELL=n
  kfsw.services.param_worker.apply:
    tags: [unit, services, param, csp]
    platform_allow: [native_sim/native/64]
    integration_platforms: [native_sim/native/64]
    extra_args: EXTRA_CFLAGS=-DKFSW_TEST_APPLY=1
