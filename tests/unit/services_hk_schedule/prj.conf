CONFIG_ZTEST=y

CONFIG_KFSW_PARAM=y
CONFIG_KFSW_HK=y
# Small on purpose: a ring that wraps within a test is the only way to assert
# that it wraps, and a sample that fills quickly is the only way to assert the
# size refusal without naming a hundred parameters.
