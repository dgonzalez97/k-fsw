CONFIG_ZTEST=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_KFSW_STORAGE=y

CONFIG_KFSW_CSP=y
CONFIG_KFSW_CSP_ADDRESS=7
CONFIG_KFSW_CSP_HOSTNAME="kfsw-ftp-transfer-test"
CONFIG_KFSW_CSP_KISS_UART=n
CONFIG_KFSW_FTP=y
CONFIG_KFSW_FTP_TIMEOUT_MS=1000

# The update service is enabled to test the reserved upload path in the
# transfer layer.
CONFIG_KFSW_FWU=y
CONFIG_KFSW_FWU_MCUBOOT=n
