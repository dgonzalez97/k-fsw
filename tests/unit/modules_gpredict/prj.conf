CONFIG_ZTEST=y
CONFIG_KFSW_PARAM=y
CONFIG_KFSW_GPREDICT=y
# The shortest grace an operator could set, so the work item can be waited out.
CONFIG_KFSW_GPREDICT_GRACE_MS=250
# A travel narrower than the rotator's, so every bound test reads the Kconfig
# rather than a value that happens to match the default.
CONFIG_KFSW_GPREDICT_AZIMUTH_MIN_DEG=10
CONFIG_KFSW_GPREDICT_AZIMUTH_MAX_DEG=350
CONFIG_KFSW_GPREDICT_ELEVATION_MIN_DEG=5
CONFIG_KFSW_GPREDICT_ELEVATION_MAX_DEG=85
CONFIG_KFSW_GPREDICT_PARK_AZIMUTH_DEG=180
CONFIG_KFSW_GPREDICT_PARK_ELEVATION_DEG=10
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
