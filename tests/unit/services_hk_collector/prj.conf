CONFIG_ZTEST=y

CONFIG_KFSW_PARAM=y

# The clock gate is the point of this suite, and a wall clock only exists in a
# composition that has CSP to receive one.
CONFIG_KFSW_CSP=y
CONFIG_KFSW_CSP_ADDRESS=7
CONFIG_KFSW_CSP_HOSTNAME="kfsw-hk-collector-test"
CONFIG_KFSW_CSP_KISS_UART=n

CONFIG_KFSW_HK=y
CONFIG_KFSW_HK_REPORTS=2
CONFIG_KFSW_HK_ENTRIES=8
CONFIG_KFSW_HK_HISTORY=4
CONFIG_KFSW_HK_SAMPLE_BYTES=32

# The floor bounds how short a period a test may ask for, and the cases below
# wait in real time, so it is set low to keep them quick.
CONFIG_KFSW_HK_PERIOD_FLOOR_MS=100
