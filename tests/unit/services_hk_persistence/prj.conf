CONFIG_ZTEST=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_KFSW_STORAGE=y

CONFIG_KFSW_PARAM=y
CONFIG_KFSW_HK=y
CONFIG_KFSW_HK_PERSISTENCE=y

# The policy a report carries is the point of version 2, so the suite has to
# compose the two things that policy configures.
CONFIG_KFSW_HK_STORE=y
CONFIG_KFSW_HK_STORE_CAPACITY=8
CONFIG_KFSW_HK_STORE_FLOOR_MS=1000
CONFIG_KFSW_CSP=y
CONFIG_KFSW_CSP_ADDRESS=7
CONFIG_KFSW_CSP_HOSTNAME="kfsw-hk-persist-test"
CONFIG_KFSW_CSP_KISS_UART=n
CONFIG_KFSW_HK_CSP=y
CONFIG_KFSW_HK_BEACON=y
CONFIG_KFSW_HK_REPORTS=2
CONFIG_KFSW_HK_ENTRIES=8
CONFIG_KFSW_HK_HISTORY=4
CONFIG_KFSW_HK_SAMPLE_BYTES=32
