CONFIG_ZTEST=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_KFSW_STORAGE=y

CONFIG_KFSW_PARAM=y
CONFIG_KFSW_HK=y
CONFIG_KFSW_HK_STORE=y
CONFIG_KFSW_HK_REPORTS=2
CONFIG_KFSW_HK_ENTRIES=8
CONFIG_KFSW_HK_HISTORY=4
CONFIG_KFSW_HK_SAMPLE_BYTES=32

# Small on purpose. The file is a ring, and a ring that cannot be filled inside
# a test is a ring whose wrap is never exercised.
CONFIG_KFSW_HK_STORE_CAPACITY=8
CONFIG_KFSW_HK_STORE_FLOOR_MS=1000
