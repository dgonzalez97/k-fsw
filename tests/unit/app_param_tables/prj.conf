CONFIG_ZTEST=y

CONFIG_KFSW_PARAM=y
CONFIG_KFSW_PARAM_CSP=n

CONFIG_KFSW_CSP=y
CONFIG_KFSW_CSP_ADDRESS=11
CONFIG_KFSW_CSP_HOSTNAME="kfsw-tables-test"
CONFIG_KFSW_CSP_KISS_UART=n

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_KFSW_STORAGE=y

CONFIG_KFSW_HEALTH=y
CONFIG_KFSW_COMMAND=y
CONFIG_KFSW_FTP=y

CONFIG_WATCHDOG=y
CONFIG_KFSW_WATCHDOG=y
CONFIG_KFSW_WATCHDOG_TIMEOUT_MS=9000
CONFIG_HWINFO=y

# The service tables compose alongside the core ones, so the suite can check
# that a service table lands in the service band and not the core one.
CONFIG_KFSW_EVENT=y
CONFIG_KFSW_FWU=y
CONFIG_KFSW_HEALTH=y
CONFIG_KFSW_COMMAND=y
CONFIG_KFSW_FTP=y
