CONFIG_ZTEST=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
# Scrub reads the secondary image where FWU writes it, so it needs FWU for the
# offset. No bootloader on this target, so nothing is offered for a swap.
CONFIG_KFSW_FWU=y
CONFIG_KFSW_FWU_MCUBOOT=n
CONFIG_KFSW_FWU_SLOT_OFFSET_SECTORS=1
CONFIG_KFSW_SCRUB=y
# Writing over programmed bytes is how the test simulates a decayed bit.
CONFIG_FLASH_SIMULATOR_DOUBLE_WRITES=y
