CONFIG_KFSW_ROLE="kfsw-gnd-crypto"
CONFIG_KFSW_INSTANCE_NAME="kfsw-gnd-crypto"
CONFIG_SHELL_PROMPT_UART="kfsw-gnd-crypto# "
CONFIG_KFSW_CSP_ADDRESS=17
CONFIG_KFSW_CSP_HOSTNAME="kfsw-gnd-crypto"
CONFIG_KFSW_CSP_UART_PEER_ADDRESS=2
CONFIG_KFSW_CSP_ROUTE_TABLE="0/0 KISS"
CONFIG_KFSW_RADIO_UHF=y
CONFIG_KFSW_RADIO_UHF_EXPECTED_SERIAL_BAUD=57600
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_KERNEL_SHELL=y

# The first remote read downloads every descriptor: about 35 s for a hundred at
# 57600 baud, so the 10 s default is too short here.
CONFIG_KFSW_PARAM_LIST_TIMEOUT_MS=120000
