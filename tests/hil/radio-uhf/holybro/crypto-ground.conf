CONFIG_KFSW_ROLE="kfsw-gnd-crypto"
CONFIG_KFSW_INSTANCE_NAME="kfsw-gnd-crypto"
CONFIG_SHELL_PROMPT_UART="kfsw-gnd-crypto# "
CONFIG_KFSW_CSP_ADDRESS=17
CONFIG_KFSW_CSP_HOSTNAME="kfsw-gnd-crypto"
CONFIG_KFSW_CSP_UART_PEER_ADDRESS=2
CONFIG_KFSW_CSP_ROUTE_TABLE="0/0 KISS"
CONFIG_KFSW_RADIO_UHF=y
CONFIG_KFSW_RADIO_UHF_EXPECTED_SERIAL_BAUD=57600
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_KERNEL_SHELL=y

# A remote read resolves a name before it fetches a value, so the first one to
# an uncached node downloads every descriptor. Measured over this link: about
# 35 seconds for a hundred of them at 57600 baud, against roughly nothing over
# CAN. The 10 second default fails here, and fails as a plain timeout that
# reads like an unreachable node.
CONFIG_KFSW_PARAM_LIST_TIMEOUT_MS=120000
