CONFIG_KFSW_ROLE="kfsw-gnd-can"
CONFIG_KFSW_INSTANCE_NAME="kfsw-gnd-can"
CONFIG_SHELL_PROMPT_UART="kfsw-gnd-can# "
CONFIG_KFSW_CSP_ADDRESS=16
CONFIG_KFSW_CSP_HOSTNAME="kfsw-gnd-can"
CONFIG_KFSW_CSP_ROUTE_TABLE="0/0 CAN"
CONFIG_CAN=y
CONFIG_KFSW_CSP_CAN=y
CONFIG_KFSW_CSP_CAN_BITRATE=500000
CONFIG_KFSW_FWU=y
CONFIG_KFSW_FWU_MCUBOOT=n
CONFIG_KFSW_FWU_LITE=y
CONFIG_KFSW_FWU_LITE_CSP=y
CONFIG_KFSW_FWU_LITE_BLOCK_SIZE=192
CONFIG_KFSW_FWU_LITE_HOST_FILES=y
CONFIG_KFSW_FWU_LITE_RDP=n

# SocketCAN polls TX completion after a 1 ms sleep.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
