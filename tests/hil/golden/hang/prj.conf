# An image that hangs as the first thing main() does, built with the boot
# budget and the Golden installer the flight image carries, so the recovery
# path is the real one and only main() is broken. It never arms or feeds a
# watchdog: only the bootloader's can reset it.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_HWINFO=y
CONFIG_REBOOT=y
CONFIG_KFSW_LASTWORDS=y
CONFIG_KFSW_BOOT_STORE=y
CONFIG_KFSW_BOOT_BUDGET=y
CONFIG_KFSW_FWU=y
CONFIG_KFSW_FWU_STANDARD=n
CONFIG_KFSW_FWU_MCUBOOT=y
CONFIG_KFSW_GOLDEN=y
CONFIG_KFSW_WATCHDOG=n
