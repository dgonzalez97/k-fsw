# Report scope. Twister has no option for gcovr's filters, so gcovr reads them
# from here: it looks for gcovr.cfg in the directory given as --coverage-basedir.
filter = k-fsw/app/
filter = kfsw-platform/src/
filter = kfsw-services/src/
filter = kfsw-comms/src/
filter = kfsw-modules/

# libcsp and libparam are pinned upstream projects with their own tests, and a
# suite that runs is not evidence about the code under test.
exclude = .*/third_party/.*
exclude = .*/tests/.*

# Where the report turns red, amber and green. gcovr's defaults are 75 and 90,
# which paint almost everything here red and say nothing about which file to
# pick up next. 50 and 80 are set against what this tree actually is: a service
# under 50% has paths no test has ever taken, and one over 80% is covered well
# enough that the remaining lines are usually error returns worth reading
# before chasing.
#
# These are report colours, not a gate. Nothing fails a build for being amber.
medium-threshold = 50
high-threshold = 80
medium-threshold-branch = 50
high-threshold-branch = 80
