# Report scope. Twister has no option for gcovr's filters, so gcovr reads them
# from here: it looks for gcovr.cfg in the directory given as --coverage-basedir.
filter = k-fsw/app/
filter = kfsw-platform/src/
filter = kfsw-services/src/
filter = kfsw-comms/src/
filter = kfsw-modules/

# libcsp and libparam are pinned upstream projects with their own tests, and a
# suite that runs is not evidence about the code under test.
exclude = .*/third_party/.*
exclude = .*/tests/.*
