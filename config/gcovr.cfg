# Report scope. Twister has no option for gcovr's filters, so gcovr reads them
# from here: it looks for gcovr.cfg in the directory given as --coverage-basedir.
filter = k-fsw/app/
filter = kfsw-platform/src/
filter = kfsw-services/src/
filter = kfsw-comms/src/
filter = kfsw-modules/

# libcsp and libparam are upstream projects with their own tests.
exclude = .*/third_party/.*
exclude = .*/tests/.*

exclude-directory = .*/modules/(picolibc|libcsp|mbedtls|littlefs|mcuboot)(/|$)

# Build variants can define the same function on different source lines.
merge-mode-functions = separate

# gcov occasionally reports an impossible hit count on a loop line, which gcovr
# treats as fatal and which then discards every report. Warn once per file and
# keep the rest: https://gcc.gnu.org/bugzilla/show_bug.cgi?id=68080
gcov-ignore-parse-errors = suspicious_hits.warn_once_per_file

# Report colours: under 50% red, over 80% green. They don't fail the build.
medium-threshold = 50
high-threshold = 80
medium-threshold-branch = 50
high-threshold-branch = 80
