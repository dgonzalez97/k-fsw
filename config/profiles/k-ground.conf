# K-FSW Linux ground composition. Node-specific identity and routing values
# are generated by tools/k-ground.
CONFIG_KFSW_ROLE="kfsw-gnd-uhf"
CONFIG_KFSW_INSTANCE_NAME="kfsw-gnd-uhf"
CONFIG_SHELL_PROMPT_UART="kfsw-gnd-uhf# "

CONFIG_KFSW_CSP=y
CONFIG_KFSW_CSP_ADDRESS=16
CONFIG_KFSW_CSP_HOSTNAME="kfsw-gnd-uhf"
CONFIG_KFSW_CSP_KISS_UART=y
CONFIG_KFSW_CSP_UART_PEER_ADDRESS=19

# CSP buffers and connection queue, sized for the largest burst this node
# receives. Too few buffers stops a transfer, and a short queue drops packets
# from a listing. libcsp's defaults of 15 and 16 are too small. Descriptor
# lists use RDP, so these don't need to grow with the number of parameters.
CONFIG_CSP_BUFFER_COUNT=32
CONFIG_CSP_CONN_RXQUEUE_LEN=32
CONFIG_CSP_QFIFO_LEN=32
