# K-FSW Linux ground composition. Node-specific identity and routing values
# are generated by tools/k-ground.
CONFIG_KFSW_ROLE="ground"
CONFIG_KFSW_INSTANCE_NAME="main"
CONFIG_SHELL_PROMPT_UART="k-ground# "

CONFIG_KFSW_CSP=y
CONFIG_KFSW_CSP_ADDRESS=16
CONFIG_KFSW_CSP_HOSTNAME="k-ground-main"
CONFIG_KFSW_CSP_KISS_UART=y
CONFIG_KFSW_CSP_UART_PEER_ADDRESS=17
