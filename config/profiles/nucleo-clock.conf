# A wall clock a node can be given over the link.
#
# libcsp's management port already carries the exchange, and its Zephyr hooks
# reach the clock through POSIX, so what a composition has to add is the clock
# itself.
CONFIG_COUNTER=y
CONFIG_RTC=y
CONFIG_POSIX_API=y
CONFIG_POSIX_TIMERS=y
CONFIG_POSIX_CLOCK_SELECTION=y
