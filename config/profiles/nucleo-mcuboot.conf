# Opt-in NUCLEO composition that boots through MCUboot.
CONFIG_BOOTLOADER_MCUBOOT=y

# Upstream image management. MCUboot already owns confirming an image and
# requesting an upgrade, so K-FSW composes those rather than reimplementing
# them: mcuboot confirm, mcuboot request_upgrade, mcuboot erase.
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_MCUBOOT_SHELL=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
