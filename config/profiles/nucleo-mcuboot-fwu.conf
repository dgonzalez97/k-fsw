# Firmware update on top of the MCUboot profile.
CONFIG_KFSW_FWU=y
CONFIG_KFSW_FWU_STANDARD=y
CONFIG_KFSW_FWU_MCUBOOT=y
CONFIG_KFSW_FWU_SLOT_OFFSET_SECTORS=1
CONFIG_KFSW_FWU_STREAM_BUFFER_SIZE=512

# Install the recovery image when an image will not stay up. The budget is
# boot_retries, which needs the parameter snapshot to outlive the boots.
CONFIG_KFSW_GOLDEN=y
CONFIG_KFSW_GOLDEN_RETRIES=3

# Re-read the resident images against a learned reference, once an hour. The
# references are persisted parameters, so they need the snapshot too.
CONFIG_KFSW_SCRUB=y
