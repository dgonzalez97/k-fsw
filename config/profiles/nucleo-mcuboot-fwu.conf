# Firmware update over the air, on top of the MCUboot composition.
#
# Layered rather than folded into nucleo-mcuboot.conf: a board can boot through
# a bootloader without also accepting images over the radio, and separating the
# two keeps that choice available.
CONFIG_KFSW_FWU=y
CONFIG_KFSW_FWU_MCUBOOT=y
CONFIG_KFSW_FWU_SLOT_OFFSET_SECTORS=1
CONFIG_KFSW_FWU_STREAM_BUFFER_SIZE=512
