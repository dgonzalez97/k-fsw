# The direct upload path, alongside the file transfer route. Both feed the same
# update service and can be built together; whichever starts a transfer first
# holds it and the other is told the node is busy.
CONFIG_KFSW_FWU_LITE=y
CONFIG_KFSW_FWU_LITE_CSP=y
CONFIG_KFSW_FWU_LITE_BLOCK_SIZE=192
# Reliable delivery stays off: per-block checks and repeats already recover
# losses, and a second retry layer underneath can stall rather than report.
CONFIG_KFSW_FWU_LITE_RDP=n
