# The v1.0.0 hardware test bench: CAN to one ground node and encrypted UHF to
# another, with MCUboot and firmware update. Addresses and baud match the bench.

CONFIG_KFSW_CSP_ADDRESS=2
CONFIG_KFSW_CSP_HOSTNAME="kfsw-2"

# CAN reaches ground node 16; the KISS peer is the radio ground, node 17.
CONFIG_KFSW_CSP_UART_PEER_ADDRESS=17

CONFIG_KFSW_RADIO_UHF=y
CONFIG_KFSW_RADIO_UHF_HOLYBRO=y
CONFIG_KFSW_RADIO_UHF_EXPECTED_SERIAL_BAUD=57600

# The descriptor timeout stays at its default. Raising it here would block
# start-up when a remote peer is off.
