# The bench composition, as a profile rather than a test fixture.
#
# CAN to a wired ground node and an encrypted UHF link to a remote one, on one
# board, with MCUboot and firmware update underneath. It is what the v1.0.0
# hardware acceptance actually ran, so a release image can be built from
# profiles instead of borrowing files out of tests/hil.
#
# It is a bench article, not a flight configuration: the addresses, the peer
# and the radio baud are the ones the laboratory fixture uses. A mission
# composes its own.

CONFIG_KFSW_CSP_ADDRESS=2
CONFIG_KFSW_CSP_HOSTNAME="kfsw-2"

# Two grounds, one board: CAN reaches node 16 by its own route, and the KISS
# peer is the radio ground, node 17.
CONFIG_KFSW_CSP_UART_PEER_ADDRESS=17

CONFIG_KFSW_RADIO_UHF=y
CONFIG_KFSW_RADIO_UHF_HOLYBRO=y
CONFIG_KFSW_RADIO_UHF_EXPECTED_SERIAL_BAUD=57600

# The descriptor budget is deliberately left at its default here. It is the
# client's, and the client for the slow link is the ground: a flight node that
# raises it blocks its own startup for minutes when a peer it reads is simply
# not powered, because housekeeping resolves remote entries as it starts.
