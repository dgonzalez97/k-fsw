# CSP over the physical UART on the NUCLEO-F746ZG, on USART6 and an FTDI
# cable. The board keeps its shell on the ST-LINK port, which is USART3 here.
CONFIG_KFSW_CSP_KISS_UART=y
CONFIG_KFSW_CSP_UART_PEER_ADDRESS=1
# Everything off-node leaves through the serial link. Combining this with
# f746-can.conf needs a route table that names which nodes go over CAN, as
# nucleo-can.conf does for the L496ZG; one of the two profiles must win.
CONFIG_KFSW_CSP_ROUTE_TABLE="0/0 KISS"

# Avoid overruns in the pinned libcsp polling backend on a physical UART.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_KFSW_CSP_UART_INTERRUPT_DRIVEN=y

# Reserve a small heap for libcsp runtime allocations.
CONFIG_HEAP_MEM_POOL_SIZE=2048

# A node that answers only pings proves the framing and nothing above it. The
# parameter service makes the link testable: identity and counters read from
# the other side. Persistence stays off, as this board has no filesystem.
CONFIG_KFSW_PARAM=y
CONFIG_KFSW_PARAM_CSP=y
