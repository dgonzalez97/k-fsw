# Parameter limits on the board with the bus as its only link, on top of
# nucleo-can.conf. The rule file arrives over CAN and the released command goes
# back the same way, which is what a node with one radio actually looks like.
CONFIG_KFSW_CSP_ROUTE_TABLE="0/0 CAN"
CONFIG_KFSW_LIMITS=y

# Manual sweeps: a dwell and a latch are only reproducible when the test
# decides when a sweep happens.
CONFIG_KFSW_LIMITS_INTERVAL_MS=0
