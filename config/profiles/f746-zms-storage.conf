CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_DISK_ACCESS=y
CONFIG_FS_LITTLEFS_BLK_DEV=y
CONFIG_ZMS=y
CONFIG_ZMS_DATA_CRC=y
CONFIG_ZMS_NO_DOUBLE_WRITE=y
CONFIG_KFSW_STORAGE=y
CONFIG_KFSW_STORAGE_ZMS_DISK=y
CONFIG_KFSW_STORAGE_ZMS_SECTOR_COUNT=48
CONFIG_KFSW_STORAGE_TMP=n

# Persistent parameters and file transfer in the running A composition.
CONFIG_KFSW_PARAM_PERSISTENCE=y
CONFIG_KFSW_FTP=y
