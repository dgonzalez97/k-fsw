# Apply after nucleo-can.conf; retain the board's dedicated UART wiring.
CONFIG_KFSW_CSP_ADDRESS=1
CONFIG_KFSW_CSP_HOSTNAME="limits-board"
CONFIG_KFSW_CSP_KISS_UART=y
CONFIG_KFSW_CSP_UART_PEER_ADDRESS=16
CONFIG_KFSW_CSP_ROUTE_TABLE="17 CAN,16 KISS,0/0 KISS"
CONFIG_KFSW_COMMAND=y
CONFIG_KFSW_COMMAND_CSP=y
CONFIG_KFSW_FBO=y
CONFIG_KFSW_LIMITS=y
# Manual sweeps make dwell and the queued duplicate check reproducible.
CONFIG_KFSW_LIMITS_INTERVAL_MS=0
CONFIG_KFSW_GNDWDT_ENABLED_AT_START=n
