# CSP over CAN on the NUCLEO, next to the UART/KISS link. Routes choose the
# interface for each destination.
CONFIG_CAN=y
CONFIG_KFSW_CSP_CAN=y
CONFIG_KFSW_CSP_CAN_INTERFACE_NAME="CAN"
CONFIG_KFSW_CSP_CAN_BITRATE=500000

# Reach the ground node over CAN, and keep everything else on the serial link.
CONFIG_KFSW_CSP_ROUTE_TABLE="16/14 CAN,0/0 KISS"
