# CSP over CAN on the NUCLEO, alongside the existing UART/KISS link.
#
# Both interfaces are registered, so a route decides which one carries a given
# destination. That is the point of putting CAN behind the same router rather
# than beside it.
CONFIG_CAN=y
CONFIG_KFSW_CSP_CAN=y
CONFIG_KFSW_CSP_CAN_INTERFACE_NAME="CAN"
CONFIG_KFSW_CSP_CAN_BITRATE=500000

# Reach the ground node over CAN, and keep everything else on the serial link.
CONFIG_KFSW_CSP_ROUTE_TABLE="16/14 CAN,0/0 KISS"
