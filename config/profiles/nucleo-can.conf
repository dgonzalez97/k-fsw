# CSP over CAN on the NUCLEO, next to the UART/KISS link. Routes choose the
# interface for each destination.
CONFIG_CAN=y
CONFIG_KFSW_CSP_CAN=y
CONFIG_KFSW_CSP_CAN_INTERFACE_NAME="CAN"
CONFIG_KFSW_CSP_CAN_BITRATE=500000

# Reach the ground node and the second board over CAN, and keep everything
# else on the serial link. A node missing from this list goes out over KISS,
# where nothing answers it.
CONFIG_KFSW_CSP_ROUTE_TABLE="3 CAN,16 CAN,0/0 KISS"
