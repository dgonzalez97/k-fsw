CONFIG_KFSW_RADIO_UHF_CRYPTO=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_HARDWARE_DEVICE_CS_GENERATOR=y
CONFIG_MBEDTLS_PSA_CRYPTO_EXTERNAL_RNG=y

# Authenticate CSP over the radio. The key is read at build time from
# KFSW_CSP_HMAC_KEY_FILE and never enters the tree. This signs without
# refusing anything: KFSW_CSP_HMAC_REQUIRE is the step that can lock an
# operator out, and it wants a pass of counters behind it first.
CONFIG_KFSW_CSP_HMAC=y
