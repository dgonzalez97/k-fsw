CONFIG_KFSW_RADIO_UHF_CRYPTO=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_HARDWARE_DEVICE_CS_GENERATOR=y
CONFIG_MBEDTLS_PSA_CRYPTO_EXTERNAL_RNG=y

# A remote read resolves a name before it fetches a value, so the first one to
# an uncached node downloads every descriptor. Measured over this link: about
# 35 seconds for a hundred of them at 57600 baud, against roughly nothing over
# CAN. The 10 second default fails here, and fails as a plain timeout that
# reads like an unreachable node.
CONFIG_KFSW_PARAM_LIST_TIMEOUT_MS=120000
