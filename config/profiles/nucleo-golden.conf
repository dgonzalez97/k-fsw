# The recovery composition that lives in kfsw_golden_partition.
#
# It exists to be reachable and to take a new image, nothing else. Everything
# that is not needed for those two jobs is off, because the golden partition is
# 192 KB where a slot is 352 KB, and because a recovery image with fewer
# services has fewer ways to fail.
#
# Kept: CSP with its UART link, remote parameters, the command server, and both
# update routes. Dropped: housekeeping, the ground watchdog, health, the
# resource monitor, events, the parameter table service, FTP, and the
# filesystem they need. FWU writes straight to flash, so no storage is
# required to take an image.
#
# Layer it on the MCUboot profile; it is signed and flashed like any image.

# No console. The shell is a quarter of this image and an orbiting node cannot
# reach it anyway, so recovery goes over CSP. For bench work, layer a file with
# CONFIG_KFSW_DEBUG_SHELL=y, CONFIG_SHELL=y and CONFIG_MCUBOOT_SHELL=y on top;
# that costs about 45 KB of the 192 KB partition.
CONFIG_KFSW_DEBUG_SHELL=n
CONFIG_SHELL=n
CONFIG_MCUBOOT_SHELL=n

# Comms. Both links the flight image uses, because a recovery image that
# cannot be reached over the link the bench and the ground node actually use
# is a recovery image in name only. Layer nucleo-can.overlay with this.
CONFIG_KFSW_CSP=y
CONFIG_KFSW_CSP_KISS_UART=y
CONFIG_CAN=y
CONFIG_KFSW_CSP_CAN=y
CONFIG_KFSW_CSP_CAN_INTERFACE_NAME="CAN"
CONFIG_KFSW_CSP_CAN_BITRATE=500000
CONFIG_KFSW_CSP_ROUTE_TABLE="3 CAN,16 CAN,0/0 KISS"

# Parameters, readable and writable from the ground
CONFIG_KFSW_PARAM=y
CONFIG_KFSW_PARAM_CSP=y
CONFIG_KFSW_PARAM_PERSISTENCE=n

# Commandable without a shell, because an orbiting node has no console
CONFIG_KFSW_COMMAND=y
CONFIG_KFSW_COMMAND_CSP=y

# Both update routes. FWU lite needs FWU.
CONFIG_KFSW_FWU=y
CONFIG_KFSW_FWU_MCUBOOT=y
CONFIG_KFSW_FWU_SLOT_OFFSET_SECTORS=1
CONFIG_KFSW_FWU_STREAM_BUFFER_SIZE=512
CONFIG_KFSW_FWU_LITE=y
CONFIG_KFSW_FWU_LITE_CSP=y
CONFIG_KFSW_FWU_LITE_BLOCK_SIZE=192
CONFIG_KFSW_FWU_LITE_RDP=n

# Off: not needed to be reached or to be updated
CONFIG_KFSW_STORAGE=n
CONFIG_KFSW_STORAGE_TMP=n
CONFIG_KFSW_FTP=n
CONFIG_KFSW_HK=n
CONFIG_KFSW_GNDWDT=n
CONFIG_KFSW_HEALTH=n
CONFIG_KFSW_RESMON=n
CONFIG_KFSW_EVENT=n
CONFIG_KFSW_TABLE=n
CONFIG_KFSW_LOG_HISTORY=n
CONFIG_KFSW_LOG_REMOTE=n
CONFIG_KFSW_CSP_LIVENESS=n
