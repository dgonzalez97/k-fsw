# The recovery image for kfsw_golden_partition, which is 192 KB where a slot is
# 352 KB. It only has to be reachable and to take a new image, so everything
# else is off. FWU writes straight to flash and needs no filesystem.
#
# Layer it on the MCUboot profile, with nucleo-can.overlay for the CAN link.

# No console. The shell is a quarter of this image and an orbiting node cannot
# reach it. For bench work layer CONFIG_KFSW_DEBUG_SHELL=y, CONFIG_SHELL=y and
# CONFIG_MCUBOOT_SHELL=y on top, which costs about 45 KB.
CONFIG_KFSW_DEBUG_SHELL=n
CONFIG_SHELL=n
CONFIG_MCUBOOT_SHELL=n

# Both links the flight image uses, with its route table.
CONFIG_KFSW_CSP=y
CONFIG_KFSW_CSP_KISS_UART=y
CONFIG_CAN=y
CONFIG_KFSW_CSP_CAN=y
CONFIG_KFSW_CSP_CAN_INTERFACE_NAME="CAN"
CONFIG_KFSW_CSP_CAN_BITRATE=500000
CONFIG_KFSW_CSP_ROUTE_TABLE="3 CAN,16 CAN,0/0 KISS"

CONFIG_KFSW_PARAM=y
CONFIG_KFSW_PARAM_CSP=y
CONFIG_KFSW_PARAM_PERSISTENCE=n
CONFIG_KFSW_COMMAND=y
CONFIG_KFSW_COMMAND_CSP=y

# Nobody confirms this image, so it confirms itself once it has started and a
# trial swap into it stops being reverted.
CONFIG_KFSW_BOOT_CONFIRM_AT_START=y

# FWU lite needs FWU.
CONFIG_KFSW_FWU=y
CONFIG_KFSW_FWU_STANDARD=n
CONFIG_KFSW_FWU_MCUBOOT=y
CONFIG_KFSW_FWU_SLOT_OFFSET_SECTORS=1
CONFIG_KFSW_FWU_STREAM_BUFFER_SIZE=512
CONFIG_KFSW_FWU_LITE=y
CONFIG_KFSW_FWU_LITE_CSP=y
CONFIG_KFSW_FWU_LITE_BLOCK_SIZE=160
CONFIG_KFSW_FWU_LITE_RDP=n

CONFIG_KFSW_STORAGE=n
CONFIG_KFSW_STORAGE_TMP=n
CONFIG_KFSW_FTP=n
CONFIG_KFSW_HK=n
CONFIG_KFSW_GNDWDT=n
CONFIG_KFSW_HEALTH=n
CONFIG_KFSW_RESMON=n
CONFIG_KFSW_EVENT=n
CONFIG_KFSW_TABLE=n
CONFIG_KFSW_LOG_HISTORY=n
CONFIG_KFSW_LOG_REMOTE=n
CONFIG_KFSW_CSP_LIVENESS=n
