# Health monitoring on top of the watchdog composition.
#
# Layered rather than folded into nucleo-watchdog.conf: a board can carry a
# watchdog fed on a timer without also making the feeding conditional, and
# keeping them separate leaves that choice visible.
CONFIG_KFSW_HEALTH=y
CONFIG_KFSW_HEALTH_MAX_COMPONENTS=8
CONFIG_KFSW_HEALTH_INTERVAL_MS=500
CONFIG_KFSW_APP_HEALTH_DEADLINE_MS=4000
