# CSP over CAN on the NUCLEO-F746ZG, as the second node of the bench bus. The
# board has no transceiver: one has to sit between PD0/PD1 and CAN_H/CAN_L, as
# on the L496ZG, or the node is not on the wire at all.
CONFIG_CAN=y
CONFIG_KFSW_CSP_CAN=y
CONFIG_KFSW_CSP_CAN_INTERFACE_NAME="CAN"
CONFIG_KFSW_CSP_CAN_BITRATE=500000
CONFIG_KFSW_CSP_ROUTE_TABLE="0/0 CAN"
