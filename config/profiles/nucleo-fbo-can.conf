# Everything over CAN for the file based operations bench scenario, on top of
# nucleo-can.conf: the procedure arrives by FTP from the ground node, the queue
# is driven from the board's own console, and the released command crosses the
# bus back.
CONFIG_KFSW_CSP_ROUTE_TABLE="0/0 CAN"

# Remote execution is not in the flight composition because it costs a second
# shell thread. The scenario composes it in to prove the allowlist holds on
# silicon, which is the only place it has never been checked.
CONFIG_KFSW_REMEXEC=y
