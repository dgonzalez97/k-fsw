# The temperature example on native_sim: there is no sensor, so table 51
# reports the reserved value.
CONFIG_KFSW_TEMPERATURE_SENSOR_EXAMPLE=y
CONFIG_KFSW_TEMP_EXAMPLE_SHELL=y

# The module registers one command, and the base composition already fills the
# 16-entry default registry, so startup would fail with -ENOSPC.
CONFIG_KFSW_COMMAND_MAX_COMMANDS=20
