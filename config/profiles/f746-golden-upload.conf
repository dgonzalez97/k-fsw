# Apply after f746-minimal.conf and f746-golden.conf.
CONFIG_MCUBOOT_BOOTLOADER_MODE_FIRMWARE_UPDATER=y
CONFIG_KFSW_FWU=y
CONFIG_KFSW_FWU_STANDARD=n
CONFIG_KFSW_FWU_RECOVERY=y
CONFIG_KFSW_FWU_MCUBOOT=n
CONFIG_KFSW_FWU_SLOT_OFFSET_SECTORS=0
CONFIG_KFSW_FWU_FILES=n
CONFIG_KFSW_GOLDEN=n
CONFIG_KFSW_SCRUB=n
CONFIG_KFSW_FWU_LITE=y
CONFIG_KFSW_FWU_LITE_CSP=y

# Receiving an image is only half of recovery: the reboot command is what boots
# it, and f746-golden.conf turns the command service off. Without these the
# node can be uploaded to but not told to run what it was given.
CONFIG_KFSW_COMMAND=y
CONFIG_KFSW_COMMAND_CSP=y

# Identify the running image as recovery in @BOOT, as the L496 Golden does.
CONFIG_KFSW_GOLDEN_IMAGE=y

# A failed recovery upload has to be diagnosable from the ground.
CONFIG_KFSW_LOG_HISTORY=y
CONFIG_KFSW_LOG_HISTORY_DEPTH=16
CONFIG_KFSW_LOG_REMOTE=y
