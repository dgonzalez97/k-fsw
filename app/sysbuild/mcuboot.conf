# The bootloader starts the independent watchdog before it jumps, so an image
# that hangs before its own main() still resets and an unconfirmed trial is
# reverted. MCUboot feeds it while it swaps. The application reprograms the
# same watchdog to its own timeout when it arms it.
#
# The timeout must cover everything the application does before arming it,
# including a Golden copy from the boot budget, and stay under the 32 s the
# IWDG reaches from the 32 kHz LSI.
CONFIG_WATCHDOG=y
CONFIG_BOOT_WATCHDOG_SETUP_AT_BOOT=y
CONFIG_BOOT_WATCHDOG_INSTALL_TIMEOUT_AT_BOOT=y
CONFIG_BOOT_WATCHDOG_TIMEOUT_MS=20000
CONFIG_BOOT_WATCHDOG_FEED=y
