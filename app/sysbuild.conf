# Only used with KFSW_SYSBUILD (the MCUboot composition).
#
# These must be SB_CONFIG_* symbols: sysbuild overrides settings placed in
# app/sysbuild/mcuboot.conf.
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# ECDSA P-256 instead of RSA-2048: smaller signatures and a smaller bootloader.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y

# The signing key is passed at build time. Without it MCUboot uses its public
# development key.
