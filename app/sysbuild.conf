# Only read when a build opts into sysbuild with KFSW_SYSBUILD, which the
# MCUboot composition does and no other target does.
#
# These are SB_CONFIG_* symbols on purpose. Sysbuild generates a forced
# .config.sysbuild for the bootloader image from them, and that file overrides
# any fragment placed in app/sysbuild/mcuboot.conf. Setting the signature type
# or swap mode there looks correct, builds cleanly, and is silently discarded.
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# ECDSA P-256 rather than the RSA-2048 default: a 64-byte signature instead of
# 256, a smaller bootloader, and faster verification on this Cortex-M4.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y

# The signing key is deliberately not named here. It is private, it lives
# outside the repository, and its path is passed at build time so nothing
# machine-specific and nothing secret is ever committed. Leaving it unset makes
# the bootloader fall back to the key MCUboot ships in its own public tree.
