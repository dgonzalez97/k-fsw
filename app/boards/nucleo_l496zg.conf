CONFIG_USE_DT_CODE_PARTITION=y

CONFIG_KFSW_CSP=y
CONFIG_KFSW_PARAM=y
# No table declares a float; the formatting costs 3.2 KB of flash.
CONFIG_KFSW_PARAM_FLOAT=n
CONFIG_KFSW_PARAM_CSP=y
CONFIG_KFSW_PARAM_PERSISTENCE=y
CONFIG_KFSW_TABLE=y
CONFIG_KFSW_FTP=y
CONFIG_KFSW_CSP_ADDRESS=2
CONFIG_KFSW_CSP_HOSTNAME="kfsw-2"

CONFIG_KFSW_CSP_KISS_UART=y
CONFIG_KFSW_CSP_UART_PEER_ADDRESS=1
# Everything off-node leaves through the serial link.
CONFIG_KFSW_CSP_ROUTE_TABLE="0/0 KISS"

# Avoid overruns in the pinned libcsp polling backend on a physical UART.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_KFSW_CSP_UART_INTERRUPT_DRIVEN=y

# Reserve a small heap for libcsp runtime allocations.
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_KFSW_COMMAND=y
CONFIG_KFSW_COMMAND_CSP=y
CONFIG_KFSW_GNDWDT=y
CONFIG_REBOOT=y
CONFIG_KFSW_EVENT=y

# Buffer and connection-queue capacity for concurrent CSP services.
CONFIG_CSP_BUFFER_COUNT=32
CONFIG_CSP_CONN_RXQUEUE_LEN=32
CONFIG_CSP_QFIFO_LEN=32

# The shell prints parameter listings from its own stack, measured at 2208
# bytes, which overflowed the 2048 default. 3072 leaves 864 spare.
CONFIG_SHELL_STACK_SIZE=3072

# Housekeeping: name a set of values once, then ask for the set.
CONFIG_KFSW_HK=y

# Beacons are built in but stay off until a report is given an interval.
CONFIG_KFSW_HK_BEACON=y

# RTC wall clock, so the time survives a reset. A power cycle also needs VBAT.
CONFIG_RTC=y

# Why the node restarted. Without these a reset leaves nothing behind: the note
# survives in retained RAM, and so does the log ring that explains it.
CONFIG_KFSW_LASTWORDS=y
CONFIG_KFSW_LASTWORDS_SUPPLY_WATCH=y
CONFIG_KFSW_LOG_HISTORY=y
CONFIG_KFSW_LOG_REMOTE=y

# The independent watchdog, armed at start. A watchdog that waits for a ground
# command does not cover the hang that happens before the first pass. The STM32
# IWDG cannot be disarmed once started.
CONFIG_WATCHDOG=y
CONFIG_KFSW_WATCHDOG=y
CONFIG_KFSW_WATCHDOG_TIMEOUT_MS=8000
CONFIG_KFSW_WATCHDOG_AUTO_START=y

# Health feeds the watchdog only while every component reports in time.
CONFIG_KFSW_HEALTH=y
CONFIG_KFSW_HEALTH_MAX_COMPONENTS=8
CONFIG_KFSW_HEALTH_INTERVAL_MS=500
CONFIG_KFSW_APP_HEALTH_DEADLINE_MS=4000

# RAM scratch volume at /kfsw/tmp (kfsw,tmp-disk in the overlay).
CONFIG_DISK_ACCESS=y
CONFIG_FS_LITTLEFS_BLK_DEV=y

# Opt in to log mirroring on the debug shell with an extra configuration.
CONFIG_KFSW_LOG_SHELL=n

# Resource monitor: how much stack each thread has left. The host build measures
# pthread stacks and cannot qualify these, so this is where the number counts.
CONFIG_KFSW_RESMON=y
