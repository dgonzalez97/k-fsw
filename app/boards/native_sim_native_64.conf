CONFIG_KFSW_CSP=y
CONFIG_KFSW_PARAM=y
CONFIG_KFSW_PARAM_CSP=y
CONFIG_KFSW_PARAM_PERSISTENCE=y
CONFIG_KFSW_FTP=y
CONFIG_KFSW_CSP_ADDRESS=1
CONFIG_KFSW_CSP_HOSTNAME="kfsw-1"
CONFIG_KFSW_CSP_KISS_UART=y
CONFIG_KFSW_CSP_UART_PEER_ADDRESS=2

# libcsp's maintained Zephyr USART driver owns a small fixed startup context.
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_KFSW_COMMAND=y
CONFIG_KFSW_COMMAND_CSP=y
CONFIG_REBOOT=y
CONFIG_KFSW_EVENT=y

# CSP transport sizing. These cover the largest burst this node receives in one
# go, not its average load, and each one fails differently when it is too
# small: an exhausted buffer pool leaves the interface with nothing to assemble
# the next frame with and the transfer stops outright, while a short connection
# queue drops the packets past its depth, so the caller gets a list that looks
# complete and is not. libcsp's own defaults of 15 and 16 are sized for
# ping-sized traffic and are not enough for either.
#
# The bulk transfers here run on reliable delivery, which paces the sender to
# its window rather than letting it queue a whole table at once, so these do
# not have to scale with CONFIG_KFSW_PARAM_MAX_DEFINITIONS. Turning
# CONFIG_KFSW_PARAM_LIST_RDP off removes that pacing and the pool would then
# have to hold a packet per parameter.
CONFIG_CSP_BUFFER_COUNT=32
CONFIG_CSP_CONN_RXQUEUE_LEN=32
CONFIG_CSP_QFIFO_LEN=32
