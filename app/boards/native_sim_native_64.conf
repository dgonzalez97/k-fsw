CONFIG_KFSW_CSP=y
CONFIG_KFSW_LOG_HISTORY=y
CONFIG_KFSW_LOG_HISTORY_CSP=y
CONFIG_KFSW_PARAM=y
# No table declares a float; the formatting costs 3.2 KB of flash.
CONFIG_KFSW_PARAM_FLOAT=n
CONFIG_KFSW_PARAM_CSP=y
CONFIG_KFSW_PARAM_PERSISTENCE=y
CONFIG_KFSW_FTP=y
CONFIG_KFSW_CSP_ADDRESS=1
CONFIG_KFSW_CSP_HOSTNAME="kfsw-1"
CONFIG_KFSW_CSP_KISS_UART=y
CONFIG_KFSW_CSP_UART_PEER_ADDRESS=2

# libcsp's Zephyr USART driver uses a small fixed startup context.
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_KFSW_COMMAND=y
CONFIG_KFSW_COMMAND_CSP=y
CONFIG_KFSW_COMMAND_RETRY=y
CONFIG_REBOOT=y
CONFIG_KFSW_EVENT=y
CONFIG_KFSW_JOURNAL=y

# Buffer and connection-queue capacity for concurrent CSP services.
CONFIG_CSP_BUFFER_COUNT=32
CONFIG_CSP_CONN_RXQUEUE_LEN=32
CONFIG_CSP_QFIFO_LEN=32

# libcsp reads the wall clock through POSIX; a native node has the host time.
CONFIG_POSIX_API=y
CONFIG_POSIX_TIMERS=y

# Housekeeping: name a set of values once, then ask for the set.
CONFIG_KFSW_HK=y

# The hosted build includes the sample store so the tests cover it.
CONFIG_KFSW_HK_STORE=y

# Beacons are built in but stay off until a report is given an interval.
CONFIG_KFSW_HK_BEACON=y

# File based operations, so a procedure can be exercised by the software tests.
CONFIG_KFSW_FBO=y

# Ground watchdog: reset unless a valid ground_wtd feed arrives.
CONFIG_KFSW_GNDWDT=y

# native_sim needs this for sys_reboot to actually stop the process.
CONFIG_NATIVE_SIM_REBOOT=y

# Resource monitor: how much stack each thread has left.
CONFIG_KFSW_RESMON=y
