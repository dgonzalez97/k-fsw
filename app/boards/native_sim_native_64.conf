CONFIG_KFSW_CSP=y
CONFIG_KFSW_PARAM=y
CONFIG_KFSW_PARAM_CSP=y
CONFIG_KFSW_PARAM_PERSISTENCE=y
CONFIG_KFSW_FTP=y
CONFIG_KFSW_CSP_ADDRESS=1
CONFIG_KFSW_CSP_HOSTNAME="kfsw-1"
CONFIG_KFSW_CSP_KISS_UART=y
CONFIG_KFSW_CSP_UART_PEER_ADDRESS=2

# libcsp's maintained Zephyr USART driver owns a small fixed startup context.
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_KFSW_COMMAND=y
CONFIG_KFSW_COMMAND_CSP=y
CONFIG_REBOOT=y
CONFIG_KFSW_EVENT=y
