CONFIG_KFSW_CSP=y
CONFIG_KFSW_PARAM=y
CONFIG_KFSW_PARAM_CSP=y
CONFIG_KFSW_PARAM_PERSISTENCE=y
CONFIG_KFSW_FTP=y
CONFIG_KFSW_CSP_ADDRESS=1
CONFIG_KFSW_CSP_HOSTNAME="kfsw-1"
CONFIG_KFSW_CSP_KISS_UART=y
CONFIG_KFSW_CSP_UART_PEER_ADDRESS=2

# libcsp's maintained Zephyr USART driver owns a small fixed startup context.
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_KFSW_COMMAND=y
CONFIG_KFSW_COMMAND_CSP=y
CONFIG_REBOOT=y
CONFIG_KFSW_EVENT=y

# CSP transport sizing. All three have to cover the largest burst this node
# receives in one go, not its average load. A parameter list sends one packet
# per parameter with no flow control, which makes it the biggest burst the
# composition produces, so all three follow CONFIG_KFSW_PARAM_MAX_DEFINITIONS.
#
# Each one truncates silently on its own when it is too small, and the symptom
# differs: an exhausted buffer pool leaves the interface with nothing to
# assemble the next frame with and the transfer stops outright, while a short
# connection queue simply drops the packets past its depth, so the caller gets
# a list that looks complete and is not. libcsp's own defaults of 15 and 16 are
# sized for ping-sized traffic.
CONFIG_CSP_BUFFER_COUNT=64
CONFIG_CSP_CONN_RXQUEUE_LEN=64
CONFIG_CSP_QFIFO_LEN=64
