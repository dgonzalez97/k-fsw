# A second CSP node for the CAN bench. It carries the shell, CSP and CAN and
# nothing that needs a filesystem, because what it is for is being another
# node on the wire.
CONFIG_KFSW_CSP=y
CONFIG_KFSW_CSP_ADDRESS=3
CONFIG_KFSW_CSP_HOSTNAME="kfsw-3"
CONFIG_KFSW_COMMAND=y
CONFIG_KFSW_COMMAND_CSP=y

# No storage on this board, so everything that lands in a file is out.
CONFIG_KFSW_PARAM_PERSISTENCE=n
CONFIG_KFSW_FTP=n
CONFIG_KFSW_STORAGE=n
CONFIG_KFSW_FBO=n
CONFIG_KFSW_JOURNAL=n
CONFIG_FLASH=n
CONFIG_FLASH_MAP=n
CONFIG_FILE_SYSTEM=n
CONFIG_FILE_SYSTEM_LITTLEFS=n
CONFIG_FILE_SYSTEM_MKFS=n

# Resource monitor: how much stack each thread has left, on real stacks.
CONFIG_KFSW_RESMON=y

# libcsp's CAN interface takes its context from the kernel heap when the
# interface opens, so a node on the bus needs one. It is allocated once at
# startup and never freed.
CONFIG_HEAP_MEM_POOL_SIZE=2048

CONFIG_CSP_BUFFER_COUNT=32
CONFIG_CSP_CONN_RXQUEUE_LEN=32
CONFIG_CSP_QFIFO_LEN=32
CONFIG_SHELL_STACK_SIZE=3072

CONFIG_BUILD_OUTPUT_HEX=y
