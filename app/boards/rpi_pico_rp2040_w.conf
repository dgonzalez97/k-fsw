# Pico W is currently qualified only for the K-FSW debug shell.
CONFIG_KFSW_CSP=n
CONFIG_KFSW_PARAM=n
CONFIG_KFSW_PARAM_PERSISTENCE=n
CONFIG_KFSW_FTP=n
CONFIG_KFSW_STORAGE=n

CONFIG_FLASH=n
CONFIG_FLASH_MAP=n
CONFIG_FILE_SYSTEM=n
CONFIG_FILE_SYSTEM_LITTLEFS=n
CONFIG_FILE_SYSTEM_MKFS=n

# Use the standard Zephyr USB device stack helper for a one-cable shell.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="K-FSW Pico W"
CONFIG_UART_LINE_CTRL=y
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y
