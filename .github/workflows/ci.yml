---
name: Software CI

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: BUILD / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile:
          - linux
          - linux_uart
          - nucleo_l496zg
          - nucleo_l496zg_uart

    steps:
      - name: Check out K-FSW
        uses: actions/checkout@v4
        with:
          path: k-fsw

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up the west workspace and Zephyr SDK
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: k-fsw
          toolchains: arm-zephyr-eabi

      - name: Validate west manifest
        run: west manifest --validate

      - name: Build profile
        run: ./k-fsw/tools/ci/build.sh "${{ matrix.profile }}"

  quality:
    name: QUALITY / clang-format + cppcheck
    runs-on: ubuntu-24.04

    steps:
      - name: Check out K-FSW
        uses: actions/checkout@v4
        with:
          path: k-fsw

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up the west workspace and Zephyr SDK
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: k-fsw
          toolchains: arm-zephyr-eabi

      - name: Install cppcheck
        run: sudo apt-get install --yes cppcheck

      - name: Check source quality
        run: ./k-fsw/tools/ci/quality.sh

  unit:
    name: UNIT / Twister
    runs-on: ubuntu-24.04

    steps:
      - name: Check out K-FSW
        uses: actions/checkout@v4
        with:
          path: k-fsw

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up the west workspace and Zephyr SDK
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: k-fsw
          toolchains: arm-zephyr-eabi

      - name: Run unit tests
        run: ./k-fsw/tools/ci/unit.sh

      - name: Upload Twister diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: twister-diagnostics
          path: |
            build/twister/twister.log
            build/twister/twister.json
            build/twister/testplan.json
            build/twister/**/handler.log
          if-no-files-found: ignore

  integration:
    name: INTEGRATION / software
    runs-on: ubuntu-24.04

    steps:
      - name: Check out K-FSW
        uses: actions/checkout@v4
        with:
          path: k-fsw

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up the west workspace and Zephyr SDK
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: k-fsw
          toolchains: arm-zephyr-eabi

      - name: Install integration dependencies
        run: sudo apt-get install --yes socat

      - name: Run shell, CSP, PARAM, storage, and FTP integration tests
        run: ./k-fsw/tools/ci/integration.sh

  valgrind:
    name: MEMORY / Valgrind
    runs-on: ubuntu-24.04

    steps:
      - name: Check out K-FSW
        uses: actions/checkout@v4
        with:
          path: k-fsw

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up the west workspace and Zephyr SDK
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: k-fsw
          toolchains: arm-zephyr-eabi

      - name: Install Valgrind
        run: sudo apt-get install --yes valgrind

      - name: Run Valgrind
        run: ./k-fsw/tools/ci/valgrind.sh

      - name: Upload Valgrind diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-diagnostics
          path: build/valgrind/*.log
          if-no-files-found: ignore

  robot:
    name: ROBOT / dry-run + software
    runs-on: ubuntu-24.04

    steps:
      - name: Check out K-FSW
        uses: actions/checkout@v4
        with:
          path: k-fsw
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up the west workspace and Zephyr SDK
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: k-fsw
          toolchains: arm-zephyr-eabi

      - name: Install software-system test dependencies
        run: sudo apt-get install --yes socat tmux

      - name: Install Robot Framework
        run: pip install -r k-fsw/tests/hil/requirements.txt

      - name: Validate all Robot suites and run software scenarios
        run: ./k-fsw/tools/ci/robot.sh

      - name: Upload Robot diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: robot-diagnostics
          path: build/robot/
          if-no-files-found: ignore

  docs:
    name: DOCS / Doxygen
    runs-on: ubuntu-24.04

    steps:
      - name: Check out K-FSW
        uses: actions/checkout@v4
        with:
          path: k-fsw

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up the west workspace
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: k-fsw
          toolchains: arm-zephyr-eabi

      - name: Install Doxygen
        run: sudo apt-get install --yes doxygen

      - name: Build and validate SDK documentation
        run: ./k-fsw/tools/ci/docs.sh
