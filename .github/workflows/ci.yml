---
name: Software CI

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: BUILD / ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux
          - nucleo_l496zg

    steps:
      - name: Check out K-FSW
        uses: actions/checkout@v4
        with:
          path: k-fsw

      - name: Set up the workspace
        uses: ./k-fsw/.github/actions/workspace

      - name: Validate west manifest
        run: west manifest --validate

      - name: Build supported target
        run: ./k-fsw/tools/ci/build.sh "${{ matrix.target }}"

      - name: Check the CSP-disabled application composition
        if: matrix.target == 'linux'
        run: ./k-fsw/tests/build-linux-minimal.sh

  quality:
    name: QUALITY / clang-format + cppcheck
    runs-on: ubuntu-24.04

    steps:
      - name: Check out K-FSW
        uses: actions/checkout@v4
        with:
          path: k-fsw

      - name: Set up the workspace
        uses: ./k-fsw/.github/actions/workspace
        with:
          packages: cppcheck

      - name: Check source quality
        run: ./k-fsw/tools/ci/quality.sh

  unit:
    name: UNIT / Twister
    runs-on: ubuntu-24.04

    steps:
      - name: Check out K-FSW
        uses: actions/checkout@v4
        with:
          path: k-fsw

      - name: Set up the workspace
        uses: ./k-fsw/.github/actions/workspace

      - name: Run unit tests
        run: ./k-fsw/tools/ci/unit.sh

      - name: Upload Twister diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: twister-diagnostics
          path: |
            build/twister/twister.log
            build/twister/twister.json
            build/twister/testplan.json
            build/twister/**/handler.log
          if-no-files-found: ignore

  integration:
    name: INTEGRATION / software
    runs-on: ubuntu-24.04

    steps:
      - name: Check out K-FSW
        uses: actions/checkout@v4
        with:
          path: k-fsw

      - name: Set up the workspace
        uses: ./k-fsw/.github/actions/workspace
        with:
          packages: socat
          requirements: k-fsw/tests/requirements.txt

      - name: Run shell, CSP, PARAM, storage, and FTP integration tests
        run: ./k-fsw/tools/ci/integration.sh

  valgrind:
    name: MEMORY / Valgrind
    runs-on: ubuntu-24.04

    steps:
      - name: Check out K-FSW
        uses: actions/checkout@v4
        with:
          path: k-fsw

      - name: Set up the workspace
        uses: ./k-fsw/.github/actions/workspace
        with:
          packages: valgrind

      - name: Run Valgrind
        run: ./k-fsw/tools/ci/valgrind.sh

      - name: Upload Valgrind diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-diagnostics
          path: build/valgrind/*.log
          if-no-files-found: ignore

  ubsan:
    name: UNDEFINED / UBSan
    runs-on: ubuntu-24.04

    steps:
      - name: Check out K-FSW
        uses: actions/checkout@v4
        with:
          path: k-fsw

      - name: Set up the workspace
        uses: ./k-fsw/.github/actions/workspace

      - name: Run the suites under UBSan
        run: ./k-fsw/tools/ci/ubsan.sh

      - name: Upload UBSan diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ubsan-diagnostics
          path: |
            build/ubsan/twister.log
            build/ubsan/**/handler.log
          if-no-files-found: ignore

  robot:
    name: ROBOT / dry-run + software
    runs-on: ubuntu-24.04

    steps:
      - name: Check out K-FSW
        uses: actions/checkout@v4
        with:
          path: k-fsw
          submodules: recursive

      - name: Set up the workspace
        uses: ./k-fsw/.github/actions/workspace
        with:
          packages: socat tmux
          requirements: k-fsw/tests/hil/requirements.txt

      - name: Validate all Robot suites and run software scenarios
        run: ./k-fsw/tools/ci/robot.sh

      - name: Upload Robot diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: robot-diagnostics
          path: build/robot/
          if-no-files-found: ignore

  docs:
    name: DOCS / Doxygen
    runs-on: ubuntu-24.04

    steps:
      - name: Check out K-FSW
        uses: actions/checkout@v4
        with:
          path: k-fsw

      - name: Set up the workspace
        uses: ./k-fsw/.github/actions/workspace
        with:
          packages: doxygen

      - name: Build and validate SDK documentation
        run: ./k-fsw/tools/ci/docs.sh
