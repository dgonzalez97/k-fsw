---
name: Software CI

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile:
          - linux
          - linux_uart
          - nucleo_l496zg
          - nucleo_l496zg_uart

    steps:
      - name: Check out K-FSW
        uses: actions/checkout@v4
        with:
          path: k-fsw

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up the west workspace and Zephyr SDK
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: k-fsw
          toolchains: arm-zephyr-eabi

      - name: Validate west manifest
        run: west manifest --validate

      - name: Build profile
        run: ./k-fsw/tools/ci/build.sh "${{ matrix.profile }}"

  quality:
    name: Source quality
    runs-on: ubuntu-24.04

    steps:
      - name: Check out K-FSW
        uses: actions/checkout@v4
        with:
          path: k-fsw

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up the west workspace and Zephyr SDK
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: k-fsw
          toolchains: arm-zephyr-eabi

      - name: Install cppcheck
        run: sudo apt-get install --yes cppcheck

      - name: Check source quality
        run: ./k-fsw/tools/ci/quality.sh

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04

    steps:
      - name: Check out K-FSW
        uses: actions/checkout@v4
        with:
          path: k-fsw

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up the west workspace and Zephyr SDK
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: k-fsw
          toolchains: arm-zephyr-eabi

      - name: Run unit tests
        run: ./k-fsw/tools/ci/unit.sh

      - name: Upload Twister diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: twister-diagnostics
          path: |
            build/twister/twister.log
            build/twister/twister.json
            build/twister/testplan.json
            build/twister/**/handler.log
          if-no-files-found: ignore
