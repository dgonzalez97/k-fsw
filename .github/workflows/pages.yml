---
name: Documentation Pages

"on":
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation artifact
    runs-on: ubuntu-24.04

    steps:
      - name: Check out K-FSW
        uses: actions/checkout@v4
        with:
          path: k-fsw
          # The site carries one directory per version, built from refs in
          # this clone, so a shallow checkout would publish only main.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up the west workspace
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: k-fsw
          toolchains: arm-zephyr-eabi

      - name: Install Doxygen
        run: sudo apt-get install --yes doxygen

      - name: Install gcovr and plotly
        run: pip install gcovr plotly

      # A version is built from a worktree at the revision its own manifest
      # pins, so those revisions have to be present and west fetches narrowly.
      - name: Fetch the history the version selector needs
        run: |
          for project in kfsw-platform kfsw-services kfsw-comms kfsw-modules; do
            git -C "$project" fetch --tags --prune --unshallow 2>/dev/null ||
              git -C "$project" fetch --tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          done

      - name: Build and validate SDK documentation
        run: ./k-fsw/tools/docs/site.sh

      - name: Name the version the extra reports belong to
        id: docs
        run: |
          slug="$(python3 -c 'import json; print(json.load(open("build/docs/site/versions.json"))["default"])')"
          echo "default=$slug" >>"$GITHUB_OUTPUT"

      # Published with the manual so both come from the same commit.
      - name: Measure coverage
        run: ./k-fsw/tools/ci/coverage.sh

      - name: Add coverage to the documentation
        run: cp -r build/coverage/html build/docs/site/${{ steps.docs.outputs.default }}/coverage

      - name: Measure footprint
        run: ./k-fsw/tools/ci/footprint.sh

      - name: Add footprint to the documentation
        run: cp -r build/footprint build/docs/site/${{ steps.docs.outputs.default }}/footprint

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs/site

  deploy:
    name: Deploy documentation to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v5
