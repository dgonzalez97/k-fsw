---
name: Set up the K-FSW workspace
description: >
  Python, the west workspace and the Zephyr SDK, plus any apt packages the job
  needs.

inputs:
  packages:
    description: apt packages this job needs, space separated
    required: false
    default: ""
  requirements:
    description: pip requirements file this job needs
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Set up the west workspace and Zephyr SDK
      uses: zephyrproject-rtos/action-zephyr-setup@v1
      with:
        app-path: k-fsw
        toolchains: arm-zephyr-eabi

    # Ten jobs each compile Zephyr from scratch, about 1300 objects a build,
    # and most of those objects are identical between jobs and between runs.
    # Zephyr's CMake uses ccache when it finds it on PATH.
    - name: Cache compiled objects
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: ${{ github.job }}-${{ runner.os }}
        restore-keys: |
          ${{ runner.os }}-
        max-size: 1G

    - name: Apply the workspace patches
      shell: bash
      run: west patch apply

    - name: Install system packages
      if: inputs.packages != ''
      shell: bash
      run: sudo apt-get install --yes ${{ inputs.packages }}

    - name: Install Python packages
      if: inputs.requirements != ''
      shell: bash
      run: pip install -r ${{ inputs.requirements }}
